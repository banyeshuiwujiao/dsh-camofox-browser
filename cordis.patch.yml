# ============================================================================
# dsh-camofox-browser —— DSH bundle patch
# ============================================================================
# 宿主半边（lib/index.js）注册一个工具 `camofox`，并把 camofox-browser 的
# REST 服务当成它的后端：第一次调用时懒启动，插件卸载时回收。
#
# 前置条件（两样，缺一不可）：
#   1. camofox-browser 源码 + 依赖：
#        git clone https://github.com/jo-inc/camofox-browser
#        cd camofox-browser && npm install
#      （Windows 上 better-sqlite3 会尝试编译；它只被单元测试引用，
#        `npm install --ignore-scripts` 即可跳过，服务不受影响。）
#   2. Camoufox 引擎（约 500MB）下载到 installDir：
#        $env:CAMOFOX_INSTALL_DIR='E:\caches\camoufox'
#        node lib/camoufox-download.js      # 需能访问 GitHub（国内走代理）
#
# 本插件没有导出 Cordis Config schema，所以这里的 config 会整块原样交给
# apply(ctx, config)（@deepseek-ai/cordis: `if (!runtime.Config) return config;`）。
#
# 安装：
#   dsh plugin --profile desktop add link:E:\development\dsh-camofox-browser
# ============================================================================

- insert:
    - id: dsh-camofox-browser
      name: dsh-camofox-browser
      config:
        # camofox-browser 的 REST 地址（服务默认监听 9377）。
        baseUrl: 'http://127.0.0.1:9377'
        # camofox-browser 源码目录（里面要有 server.js）。
        serverDir: 'C:\Users\Admin\DeepSeek_Harness\dsh-client-config\plugins\camofox-browser'
        # Camoufox 引擎目录。留空 = 用 camoufox-js 默认位置
        # （%LOCALAPPDATA%\camoufox\camoufox\Cache）。注意变量名是 CAMOUFOX_INSTALL_DIR
        # （含 U）；写成 CAMOFOX_INSTALL_DIR 不报错，但会被当作「没装」并静默重下 500MB。
        installDir: ''
        # 引擎解压前的临时目录（默认 os.tmpdir()，峰值约 600MB，故挪到 E 盘）。
        tempDir: 'E:\caches\tmp'
        # 留空则用 DSH 自己的 node（process.execPath）。
        nodePath: ''
        # 会话所有者：决定 cookie / localStorage 的分区与持久化目录。
        userId: 'dsh'
        sessionKey: 'default'
        # 第一次调用工具时若服务没跑就自动拉起。
        autoStart: true
        startTimeoutMs: 120000
        requestTimeoutMs: 90000
        # 截图落盘目录；空则落到 DSH 会话工作区（一次性草稿）。
        screenshotDir: 'C:\Users\Admin\DeepSeek_Harness\dsh-client-config\plugins\dsh-camofox-browser\shots'
        # 单次返回给模型的文本上限，防止一次快照吃满上下文。
        maxChars: 40000
        # 浏览器代理。默认关闭：直连时 Camoufox 不声明地理位置，身份更中性。
        # 打开后 camofox 会用 GeoIP 按出口 IP 自动对齐时区/语言。
        proxy:
          enabled: false
          host: '127.0.0.1'
          port: '7897'
          protocol: 'http'
          username: ''
          password: ''
        # 追加给服务子进程的环境变量。
        env: {}
